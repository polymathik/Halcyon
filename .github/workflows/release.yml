name: Release

# Publishes halcyon-ai to npm when a version tag (v0.1.0, ...) is pushed.
# Uses npm trusted publishing (OIDC): configure this repository and workflow
# as a trusted publisher in the package's settings on npmjs.com. No token is
# stored here, and npm adds a provenance statement automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/server version $version" >&2
            exit 1
          fi
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter halcyon-ai run package
      - name: Publish
        working-directory: packages/server/release
        run: npm publish
